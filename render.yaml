# Render Blueprint — Autonomous SQL Data Analyst Agent
# Deploy: push to GitHub, then in Render → "New +" → "Blueprint" → select this repo.
#
# DB is Neon (external) — Render no longer provisions Postgres for this app.
# After provisioning:
#   1. Set GEMINI_API_KEY on the `agent-backend` service env.
#   2. Set READONLY_DATABASE_URL on `agent-backend` to your Neon readonly_user URL.
#      e.g. postgresql://readonly_user:readonly_pass@ep-xxx.aws.neon.tech/analyst_db?sslmode=require
#   3. After first deploy, copy backend URL and set BACKEND_URL on `agent-frontend`.

services:
  # ── Backend (FastAPI + LangGraph) ──────────────────────────────────────────
  - type: web
    name: agent-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Gemini — set the API key manually in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/

      # Neon Postgres — paste readonly_user connection string in the dashboard
      - key: READONLY_DATABASE_URL
        sync: false
      # Optional admin URL — only set if you need admin-role connections from the app
      - key: ADMIN_DATABASE_URL
        sync: false

      # App
      - key: MAX_RETRIES
        value: "3"
      - key: MAX_STEPS
        value: "4"
      - key: MAX_QUERY_ROWS
        value: "500"
      - key: MAX_QUESTION_LENGTH
        value: "500"
      - key: RATE_LIMIT
        value: 15/minute

      # CORS — restrict to the frontend's URL once it's known
      - key: ALLOWED_ORIGINS
        value: "*"

  # ── Frontend (Streamlit) ───────────────────────────────────────────────────
  - type: web
    name: agent-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Paste backend URL after first deploy, e.g. https://agent-backend.onrender.com
      - key: BACKEND_URL
        sync: false
